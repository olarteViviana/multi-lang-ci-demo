pipeline:
  name: multi-lang-ci-pipeline
  identifier: multilangcipipeline
  projectIdentifier: multilangcidemo
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: OlarteVivi
        build: <+input>
  stages:
    - stage:
        name: Stage-multi-lang
        identifier: Stagemultilang
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
          buildIntelligence:
            enabled: true
          execution:
            steps:
              - step:
                  type: Run
                  name: python-tests
                  identifier: pythontests
                  spec:
                    connectorRef: account.harnessImage
                    image: python:3.11
                    shell: Bash
                    command: |-
                      cd python_app
                      python -m pip install --upgrade pip
                      pip install -r requirements.txt
                      python -m pytest
                  description: python:3.11
              - step:
                  type: Run
                  name: node-tests
                  identifier: nodetests
                  spec:
                    connectorRef: account.harnessImage
                    image: node:20
                    shell: Bash
                    command: |-
                      cd node_app
                      npm install
                      npm test
                  description: node:20
              - step:
                  type: Run
                  name: java-tests
                  identifier: javatests
                  spec:
                    connectorRef: account.harnessImage
                    image: openjdk:21-slim
                    shell: Bash
                    command: |-
                      cd java_app
                      mkdir -p out
                      javac -d out src/main/java/com/example/App.java src/test/java/com/example/AppTest.java
                      java -cp out com.example.AppTest
                  description: openjdk:21-slim
              - step:
                  type: Run
                  name: dotnet-tests
                  identifier: dotnettests
                  spec:
                    connectorRef: account.harnessImage
                    image: mcr.microsoft.com/dotnet/sdk:8.0
                    shell: Bash
                    command: |-
                      cd dotnet_app
                      dotnet build
                      dotnet run
                  description: mcr.microsoft.com/dotnet/sdk:8.0
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: kubernetscluster
              namespace: harness-delegate-ng
              automountServiceAccountToken: true
              nodeSelector: {}
              harnessImageConnectorRef: account.harnessImage
              os: Linux
        delegateSelectors:
          - kubernetes-delegate
